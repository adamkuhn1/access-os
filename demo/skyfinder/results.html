<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SkyFinder - Flight results</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <strong>SkyFinder</strong>
      <nav aria-label="Site">
        <a href="index.html">Flights</a>
        <a href="deals.html">Deals</a>
        <a href="help.html">Help</a>
        <a href="signin.html">Sign in</a>
      </nav>
    </header>
    <p class="notice">
      Demo website for Access OS testing. All flights, airlines and prices on
      SkyFinder are fictional.
    </p>

    <main id="results" aria-busy="true">
      <div class="spinner" role="progressbar" aria-label="Searching for flights">
        Searching for flights...
      </div>
    </main>

    <footer>
      <a href="about.html">About SkyFinder</a>
      <a href="privacy.html">Privacy</a>
    </footer>

    <script>
      const names = {
        DTW: 'Detroit (DTW)', DTL: 'Detroit Lakes (DTL)', CHI: 'Chicago (all airports)',
        ORD: "Chicago O'Hare (ORD)", MDW: 'Chicago Midway (MDW)', GRR: 'Grand Rapids (GRR)',
        CLE: 'Cleveland (CLE)', MSP: 'Minneapolis (MSP)', BOS: 'Boston (BOS)',
        JFK: 'New York (JFK)', DEN: 'Denver (DEN)',
      };

      // the same flights every day; the weekday changes the price. prices
      // are made up but follow fixed rules so every search is repeatable
      const flights = [
        { airline: 'Great Lakes Jet', depart: '7:00 AM', arrive: '8:05 AM', stops: 'Nonstop', base: 109, airport: 'ORD', fare: 'Main Cabin, 1 carry-on bag included' },
        { airline: 'Midwest Connect', depart: '9:40 AM', arrive: '10:50 AM', stops: 'Nonstop', base: 97, airport: 'MDW', fare: 'Main Cabin, 1 carry-on bag included' },
        { airline: 'Lakeshore Air', depart: '6:05 AM', arrive: '9:15 AM', stops: '1 stop (GRR)', base: 84, airport: 'MDW', fare: 'Basic Economy: personal item only, no changes' },
        { airline: 'Northstar Airways', depart: '5:30 PM', arrive: '6:40 PM', stops: 'Nonstop', base: 132, airport: 'ORD', fare: 'Main Cabin, free changes' },
      ];
      // Sun..Sat
      const weekdayChange = [24, 10, -20, -12, 6, 28, 4];

      const params = new URLSearchParams(location.search);
      const from = params.get('from');
      const to = params.get('to');
      const oneWay = params.get('trip') === 'oneway';
      const tripLabel = oneWay ? 'one-way' : 'round trip';

      const parse = (value) => {
        const [y, m, d] = (value || '').split('-').map(Number);
        return y ? new Date(y, m - 1, d) : null;
      };
      let start = parse(params.get('start'));
      let end = parse(params.get('end')) || start;
      if (start && end && end < start) [start, end] = [end, start];

      const main = document.getElementById('results');

      function render() {
        main.removeAttribute('aria-busy');

        // only known airport codes, so nothing from the URL ends up as HTML
        if (!names[from] || !names[to] || !start) {
          main.innerHTML = '<h1>No search yet</h1><p><a href="index.html">Search for flights</a></p>';
          return;
        }

        const results = [];
        for (let d = new Date(start), n = 0; d <= end && n < 14; d.setDate(d.getDate() + 1), n++) {
          for (const flight of flights) {
            // a search for one Chicago airport only shows flights to it
            if (['ORD', 'MDW'].includes(to) && flight.airport !== to) continue;
            const oneWayPrice = flight.base + weekdayChange[d.getDay()];
            results.push({
              ...flight,
              date: new Date(d),
              airport: ['CHI', 'ORD', 'MDW'].includes(to) ? flight.airport : to,
              price: oneWay ? oneWayPrice : Math.round(oneWayPrice * 1.8),
            });
          }
        }

        const dateText = (d) => d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
        const range = start.getTime() === end.getTime() ? dateText(start) : `${dateText(start)} to ${dateText(end)}`;

        main.innerHTML = `
          <h1>${results.length} ${tripLabel} flights from ${names[from]} to ${names[to]}</h1>
          <p>Departing ${range}. Prices are in US dollars per adult, ${tripLabel}, including taxes. Sorted by departure date. All flights and prices on this demo site are fictional.</p>
          <p><a href="index.html">Change search</a></p>
          <aside class="deal" aria-label="Featured deal">
            Featured deal: Detroit to Chicago round trips from $49 (round trip, travel January 12 to February 2 only).
          </aside>
          <h2>Results</h2>
          <div id="list"></div>`;

        const list = main.querySelector('#list');
        for (const r of results) {
          const card = document.createElement('article');
          card.className = 'result';
          card.dataset.price = r.price;
          card.dataset.airline = r.airline;
          card.innerHTML = `
            <span>${r.airline}</span>
            <span>${dateText(r.date)}</span>
            <span>${r.depart} - ${r.arrive}</span>
            <span>${names[from]} to ${names[r.airport]}</span>
            <span>${r.stops}</span>
            <span>${r.fare}</span>
            <span class="price">$${r.price} ${tripLabel}</span>`;
          const book = document.createElement('button');
          book.type = 'button';
          book.textContent = 'Book this flight';
          book.addEventListener('click', () => { location.href = `book.html?airline=${encodeURIComponent(r.airline)}`; });
          card.append(book);
          list.append(card);
        }
      }

      // pretend the search takes a moment, like a real site
      setTimeout(render, 1500);
    </script>
  </body>
</html>
